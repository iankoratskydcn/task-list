name: task-list
version: "0.1.0"
description: >
  Owner-gated task list: a durable backlog you add to over time, where
  nothing runs until you explicitly trigger it (tick the box / `hermes
  tasklist run <id>`). Unlike Kanban, items only fire on your say-so,
  spawning a one-shot headless Hermes agent as a background job.
author: "Ian Koratsky"
kind: standalone
platforms:
  - linux
  - macos
  - windows
